name: Workspace default image smoke

on:
  pull_request:
    paths:
      - 'workspace/**'
      - '.github/workflows/workspace-default-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build and check workspace
        run: |
          set -eux
          cp .env.example .env
          docker compose config -q
          docker compose build workspace
          docker compose run --rm --no-deps --entrypoint php workspace -v
