name: Lint shell scripts

# Lints the repo's shell scripts with ShellCheck. Only errors fail the build,
# so it surfaces real bugs (bad quoting, undefined vars) without style noise.

on:
  pull_request:
    paths:
      - '**/*.sh'
      - '.github/workflows/shellcheck.yml'
  push:
    branches: [ master ]
    paths:
      - '**/*.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare empty script placeholders for ShellCheck
        run: |
          # Empty shell placeholders contain no code to lint.
          while IFS= read -r -d '' file; do
            printf '#!/bin/sh\n' > "$file"
          done < <(find . -path ./.git -prune -o -type f -name '*.sh' -empty -print0)
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: error
          ignore_paths: DOCUMENTATION
