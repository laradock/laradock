name: PHP 7.4 image smoke

on:
  pull_request:
    paths:
      - 'php-fpm/**'
      - '.github/workflows/php-fpm-74-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build and check PHP 7.4
        run: |
          set -eux
          cp .env.example .env
          printf '\nPHP_VERSION=7.4\n' >> .env
          docker compose config -q
          docker compose build php-fpm
          docker compose run --rm --no-deps --entrypoint php php-fpm -v
